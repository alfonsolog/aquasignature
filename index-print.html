<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aqua Signature — Print</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Allura&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="styles.css?v=8">

  <style>
    /* Print-specific overrides */
    html, body { background: #FAFBFB !important; }

    /* Hide UI chrome that doesn't belong in PDF */
    .nav, .lang-switch, .cur-switch, .trade-banner, .trade-gate,
    .tweaks-panel, .tweaks-toggle, [data-tweaks-panel] {
      display: none !important;
    }

    /* Force all reveal-on-scroll content visible */
    .reveal, .reveal-stagger { opacity: 1 !important; transform: none !important; }
    .reveal--scale { transform: none !important; }
    .reveal > *, .reveal-stagger > * { opacity: 1 !important; transform: none !important; }

    /* Each rendered page section gets its own break */
    .print-page {
      break-after: page;
      page-break-after: always;
      position: relative;
    }
    .print-page:last-of-type { break-after: auto; page-break-after: auto; }

    /* Ensure first hero/section sits at top of each printed page */
    .print-page > .page > section:first-child {
      padding-top: 60px !important;
    }
    .print-page .page > section:first-child .container,
    .print-page section:first-child .container {
      padding-top: 0;
    }

    /* Footer at the very end on its own page */
    .footer { break-before: page; page-break-before: always; }

    /* Avoid splitting key blocks */
    .feature-row, .product-card, .step, .stat, .cfg, .section-head,
    .gallery, .mosaic__item, .field {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* Marquee — stop animating to render statically */
    .marquee__track { animation: none !important; transform: none !important; }
    .marquee { overflow: visible !important; }

    /* Print rules */
    @page {
      size: A4 portrait;
      margin: 0;
    }
    @media print {
      html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .nav, .lang-switch, .cur-switch, .trade-banner, .trade-gate,
      .tweaks-panel, .tweaks-toggle, [data-tweaks-panel] {
        display: none !important;
      }
      /* Hint: keep dark hero pulling its background */
      .hero, .footer { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/i18n.jsx"></script>
  <script type="text/babel" src="src/currency.jsx"></script>
  <script type="text/babel" src="src/trade.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/page-home.jsx"></script>
  <script type="text/babel" src="src/page-collection.jsx"></script>
  <script type="text/babel" src="src/page-product.jsx"></script>
  <script type="text/babel" src="src/page-story.jsx"></script>
  <script type="text/babel" src="src/page-contact.jsx"></script>
  <script type="text/babel" src="src/app-print.jsx"></script>

  <script type="text/babel">
    // Auto-print once everything's rendered
    (async () => {
      try { await document.fonts.ready; } catch (e) {}
      // Wait for React + JSX scripts to finish mounting
      let waited = 0;
      while (!document.querySelector(".print-page") && waited < 6000) {
        await new Promise(r => setTimeout(r, 100));
        waited += 100;
      }
      // Force any reveal items visible
      document.querySelectorAll(".reveal, .reveal-stagger").forEach(el => el.classList.add("is-in"));
      // Settle delay
      await new Promise(r => setTimeout(r, 800));
      window.print();
    })();
  </script>
</body>
</html>
